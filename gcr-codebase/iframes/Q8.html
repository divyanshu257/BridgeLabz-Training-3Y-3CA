<!DOCTYPE html>
<html>

<head>
    <title>Feedback Form</title>
</head>

<body>

    <h1>Feedback Form</h1>

    <form method="post" action="#">

        <label>Feedback:</label>
        <br>

        <textarea
            name="feedback"
            rows="5"
            cols="40">
        </textarea>

        <br><br>

        <label>Rating:</label>
        <br>

        <input type="radio"
               name="rating"
               value="good">
        <label>Good</label>

        <br>

        <input type="radio"
               name="rating"
               value="average">
        <label>Average</label>

        <br>

        <input type="radio"
               name="rating"
               value="poor">
        <label>Poor</label>

        <br><br>

        <input type="submit"
               value="Submit Feedback">

    </form>

</body>
</html>
