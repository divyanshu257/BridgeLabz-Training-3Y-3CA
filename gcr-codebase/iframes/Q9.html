<!DOCTYPE html>
<html>

<head>
    <title>File Upload</title>
</head>

<body>

    <h1>Upload Image</h1>

    <form>

        <label>Select File:</label>

        <input type="file"
               name="image"
               accept=".jpg, .png">

        <p>
            Only JPG and PNG image files are allowed.
        </p>

        <input type="submit"
               value="Upload">

    </form>

</body>
</html>
