<!DOCTYPE html>
<html>

<head>

    <!-- title is used to set the title shown in the browser tab. -->
    <title>My Web Page</title>


    <!-- meta charset defines the character encoding. -->
    <meta charset="UTF-8">


    <!-- meta description provides a description of the webpage. -->
    <meta name="description"
          content="This is a sample webpage.">


    <!-- meta author specifies the author of the webpage. -->
    <meta name="author"
          content="Divyanshu Baghel">


    <!-- base sets the base URL for relative URLs in the page. -->
    <base href="https://example.com/">


    <!-- link connects an external resource such as a favicon or stylesheet. -->
    <link rel="icon"
          href="favicon.ico">



    <style>

    </style>


    <script>

    </script>

</head>

<body>

    <h1>My Web Page</h1>

    <p>This page demonstrates important head elements.</p>

</body>

</html>
