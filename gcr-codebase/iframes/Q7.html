<!DOCTYPE html>
<html>

<head>
    <title>Login Form</title>
</head>

<body>

    <h1>Login</h1>

    <form>

        <label>Username:</label>
        <input type="text"
               name="username"
               required>

        <br><br>

        <label>Password:</label>
        <input type="password"
               name="password"
               required>

        <br><br>

        

        <input type="hidden"
               name="csrf_token"
               value="dummy12345">

        <input type="submit"
               value="Login">

    </form>

</body>
</html>
