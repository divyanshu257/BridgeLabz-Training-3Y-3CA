<!DOCTYPE html>
<html>

<head>
    <title>Contact Form</title>
</head>

<body>

    <h1>Contact Us</h1>

    <form>

        <label>Full Name:</label>
        <br>

        <input type="text"
               name="fullname"
               placeholder="Enter your full name"
               required>

        <br><br>

        <label>Email:</label>
        <br>

        <input type="email"
               name="email"
               placeholder="Enter your email"
               required>

        <br><br>

        <label>Subject:</label>
        <br>

        <input type="text"
               name="subject"
               placeholder="Enter subject"
               required>

        <br><br>

        <label>Message:</label>
        <br>

        <textarea
            name="message"
            placeholder="Enter your message"
            rows="6"
            cols="40"
            required>
        </textarea>

        <br><br>

        <input type="submit"
               value="Send Message">

    </form>

</body>
</html>
