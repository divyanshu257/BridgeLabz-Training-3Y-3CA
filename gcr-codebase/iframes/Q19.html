<!DOCTYPE html>
<html>

<head>
    <title>Secure Form</title>
</head>

<body>

    <h1>Secure Registration Form</h1>

    <form autocomplete="off">

        <label>Username:</label>
        <input type="text"
               name="username"
               required>

        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               required>

        <br><br>

        <label>Password:</label>
        <input type="password"
               name="password"
               required>

        <br><br>

        <input type="submit"
               value="Submit">

    </form>

    <p>
        Turning off autocomplete can prevent the browser from
        automatically storing or suggesting sensitive form data.
    </p>

</body>
</html>
