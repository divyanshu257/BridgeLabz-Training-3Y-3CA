<!DOCTYPE html>
<html>

<head>
    <title>Form Page</title>
</head>

<body>

    <h1>My Form</h1>

    <form action="result.html"
          target="resultFrame">

        <label>Name:</label>

        <input type="text"
               name="name">

        <input type="submit"
               value="Submit">

    </form>

    <br>

    <iframe
        name="resultFrame"
        width="500"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
