<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combined CSS Effects</title>

  <style>
    body{
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial;
    }

    .container{
      display: flex;
      justify-content: space-evenly;
      width: 80%;
    }

    button{
      padding: 15px 30px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 16px;

      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .btn1{
      background: dodgerblue;
    }

    .btn2{
      background: green;
    }

    .btn3{
      background: purple;
    }

    button:hover{
      transform: scale(1.1);
      background: orange;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    button:active{
      transform: scale(0.95);
    }

    button:focus{
      outline: 3px solid black;
      outline-offset: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <button class="btn1">Button One</button>

    <button class="btn2">Button Two</button>

    <button class="btn3">Button Three</button>

  </div>

</body>
</html>
