<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>

  <style>
    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
    }

    .card{
      width: 500px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);

      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input,
    select{
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    input:focus,
    select:focus{
      outline: 2px solid dodgerblue;
    }

    .buttons{
      display: flex;
      gap: 15px;
    }

    button{
      padding: 12px 20px;
      background: dodgerblue;
      color: white;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: darkblue;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>User Interface Components</h2>

    <input type="search" placeholder="Search here...">

    <select>
      <option>Select Category</option>
      <option>HTML</option>
      <option>CSS</option>
      <option>JavaScript</option>
    </select>

    <div class="buttons">
      <button>Search</button>
      <button>Reset</button>
    </div>

  </div>

</body>
</html>
