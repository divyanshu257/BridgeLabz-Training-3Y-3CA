<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Sizing Comparison</title>

  <style>
    body{
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      background: #f2f2f2;
    }

    .container{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      text-align: center;
    }

    .box{
      width: 300px;
      padding: 40px;
      border: 10px solid #333;
    }

    .default{
      box-sizing: content-box;
      background: lightblue;
    }

    .border-box{
      box-sizing: border-box;
      background: lightgreen;
    }

    @media(max-width: 700px){
      .container{
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div>
      <div class="box default">
        <h2>Content Box</h2>
        <p>Width: 300px</p>
        <p>Padding and border are added outside the width.</p>
      </div>
    </div>

    <div>
      <div class="box border-box">
        <h2>Border Box</h2>
        <p>Width: 300px</p>
        <p>Padding and border are included inside the width.</p>
      </div>
    </div>

  </div>

</body>
</html>
