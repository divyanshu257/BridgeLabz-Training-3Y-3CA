<!DOCTYPE html>
<html>
<head>
  <title>Borders and Padding</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      margin: 0;
      padding: 40px;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .box {
      width: 180px;
      background: white;
      padding: 25px;
      text-align: center;
      transition: border-color 0.3s ease;
    }

    .solid {
      border: 5px solid black;
    }

    .dashed {
      border: 5px dashed blue;
    }

    .double {
      border: 8px double green;
    }

    .groove {
      border: 8px groove purple;
    }

    .rounded {
      border: 4px solid orange;
      border-radius: 25px;
    }

    .box:hover {
      border-color: red;
    }

    .padding-small {
      padding: 10px;
      border: 3px solid brown;
    }

    .padding-medium {
      padding: 30px;
      border: 3px solid brown;
    }

    .padding-large {
      padding: 60px;
      border: 3px solid brown;
    }
  </style>
</head>

<body>

  <h1>Borders and Padding</h1>

  <div class="container">

    <div class="box solid">
      Solid Border
    </div>

    <div class="box dashed">
      Dashed Border
    </div>

    <div class="box double">
      Double Border
    </div>

    <div class="box groove">
      Groove Border
    </div>

    <div class="box rounded">
      Rounded Corner
    </div>

  </div>

  <h2 style="text-align:center;">Padding Examples</h2>

  <div class="container">
    <div class="padding-small">Small Padding</div>
    <div class="padding-medium">Medium Padding</div>
    <div class="padding-large">Large Padding</div>
  </div>

</body>
</html>
