<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0">Task Tracker</h1>
            <span class="badge text-bg-primary" id="pendingCount">3 Pending</span>
          </div>

          <div class="card-body">
            <ul class="list-group" id="taskList">
              <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                <span>Finish portfolio website</span>
                <span class="badge text-bg-danger">High</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                <span>Practice Bootstrap grid</span>
                <span class="badge text-bg-warning">Medium</span>
              </li>

              <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
                <span>Update profile photo</span>
                <span class="badge text-bg-success">Low</span>
              </li>
            </ul>

            <button type="button" class="btn btn-success mt-4" id="completeButton">
              Completed <span class="badge text-bg-light" id="completedCount">0</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const completeButton = document.getElementById("completeButton");
    const taskList = document.getElementById("taskList");
    const pendingCount = document.getElementById("pendingCount");
    const completedCount = document.getElementById("completedCount");
    let completed = 0;

    completeButton.addEventListener("click", () => {
      const firstTask = taskList.querySelector("li");

      if (!firstTask) return;

      firstTask.remove();
      completed++;

      pendingCount.textContent = `${taskList.children.length} Pending`;
      completedCount.textContent = completed;
    });
  </script>
</body>
</html>
