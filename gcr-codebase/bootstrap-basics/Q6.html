<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="fw-bold text-center mb-4">Notifications Dashboard</h1>

    <div class="card shadow-sm">
      <div class="card-header fw-bold">Your Notifications</div>

      <div class="card-body">
        <div class="alert alert-success" role="alert">
          You have 2 new messages.
        </div>

        <div class="alert alert-info" role="alert">
          Tip: Update your profile to get a better experience.
        </div>

        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          Warning: Your password will expire soon.
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>

        <section class="bg-light border rounded p-4 mt-4">
          <h2 class="h5 fw-bold">Summary</h2>
          <p class="mb-0">
            You received 3 notifications today. Please review the warning.
          </p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
