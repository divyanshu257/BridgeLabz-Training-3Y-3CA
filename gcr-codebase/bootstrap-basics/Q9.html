<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Pagination</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="fw-bold text-center mb-4">Latest Blog Posts</h1>

    <div class="row g-4 mb-5">
      <div class="col-md-6">
        <article class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Getting Started with Bootstrap</h2>
            <p>Learn how to make responsive pages using the Bootstrap grid.</p>
            <a href="#post-1" class="btn btn-primary">Read More</a>
          </div>
        </article>
      </div>

      <div class="col-md-6">
        <article class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5">Useful CSS Layout Tips</h2>
            <p>Improve the layout and spacing of your websites.</p>
            <a href="#post-2" class="btn btn-primary">Read More</a>
          </div>
        </article>
      </div>
    </div>

    <nav aria-label="Blog pages">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled">
          <span class="page-link">Previous</span>
        </li>
        <li class="page-item active" aria-current="page">
          <span class="page-link">1</span>
        </li>
        <li class="page-item">
          <a class="page-link" href="#page-2">2</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#page-2">Next</a>
        </li>
      </ul>
    </nav>

    <div class="d-flex justify-content-between mt-4">
      <a href="#page-2" class="btn btn-outline-secondary">← Older Posts</a>
      <button class="btn btn-outline-secondary" disabled>Newer Posts →</button>
    </div>
  </main>
</body>
</html>
