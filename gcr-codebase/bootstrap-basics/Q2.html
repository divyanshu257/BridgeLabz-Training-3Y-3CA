<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divyanshu Baghel | Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
  <header class="container text-center p-5">
    <h1 class="fw-bold">Divyanshu Baghel</h1>
    <p class="lead">Computer Science Student | Web Developer</p>
  </header>

  <main class="container text-center">
    <img
      src="https://placehold.co/300x300?text=DB"
      alt="Divyanshu Baghel profile placeholder"
      class="img-fluid rounded-circle mb-3"
      width="200"
      height="200"
    >

    <h2 class="fw-bold mt-4">About Me</h2>
    <p class="mb-3">
      I enjoy building responsive websites and learning new technologies.
    </p>

    <div class="mb-5">
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="resume.pdf" download class="btn btn-outline-dark">Download CV</a>
    </div>

    <section class="row justify-content-center mb-5" id="contact">
      <div class="col-md-7">
        <div class="bg-white p-5 rounded shadow-sm">
          <h2 class="fw-bold mb-3">Contact Me</h2>

          <form>
            <input type="text" class="form-control mb-3" placeholder="Your name" aria-label="Your name" required>
            <input type="email" class="form-control mb-3" placeholder="Your email" aria-label="Your email" required>
            <textarea class="form-control mb-3" rows="4" placeholder="Your message" aria-label="Your message" required></textarea>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
