<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="text-center mb-5">
      <h1 class="fw-bold">Today's Menu</h1>
      <p class="lead">Fresh food, made with care.</p>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="bg-white p-4 rounded shadow-sm">
          <h2 class="h4 mb-3">Menu Items</h2>

          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead class="table-dark">
                <tr>
                  <th>Item</th>
                  <th>Category</th>
                  <th>Price</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Paneer Tikka</td>
                  <td>Starter</td>
                  <td>₹220</td>
                </tr>
                <tr>
                  <td>Veg Biryani</td>
                  <td>Main Course</td>
                  <td>₹280</td>
                </tr>
                <tr>
                  <td>Butter Naan</td>
                  <td>Bread</td>
                  <td>₹60</td>
                </tr>
                <tr>
                  <td>Gulab Jamun</td>
                  <td>Dessert</td>
                  <td>₹100</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="bg-white p-4 rounded shadow-sm">
          <h2 class="h4 mb-3">Chef's Specials</h2>

          <ul class="list-group">
            <li class="list-group-item">Special Paneer Tikka</li>
            <li class="list-group-item">Hyderabadi Veg Biryani</li>
            <li class="list-group-item">Chocolate Brownie</li>
          </ul>
        </div>
      </div>
    </div>

    <figure class="text-center mt-5">
      <img
        src="https://picsum.photos/seed/restaurant-food/900/500"
        alt="Featured restaurant dish"
        class="img-fluid rounded shadow"
      >
      <figcaption class="text-muted mt-2">Freshly prepared food served every day</figcaption>
    </figure>
  </main>
</body>
</html>
