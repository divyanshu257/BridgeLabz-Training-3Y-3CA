<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-card {
      height: 100%;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.18) !important;
    }

    .product-card img {
      height: 220px;
      object-fit: cover;
    }
  </style>
</head>
<body class="bg-light">
  <main class="container py-5">
    <h1 class="text-center fw-bold mb-4">Our Products</h1>

    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/seed/headphones/600/400" class="card-img-top" alt="Wireless headphones">
          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">Wireless Headphones</h2>
            <p class="fw-bold text-primary">₹1,999</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/seed/watch/600/400" class="card-img-top" alt="Smart watch">
          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">Smart Watch</h2>
            <p class="fw-bold text-primary">₹2,499</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/seed/speaker/600/400" class="card-img-top" alt="Bluetooth speaker">
          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">Bluetooth Speaker</h2>
            <p class="fw-bold text-primary">₹1,499</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm">
          <img src="https://picsum.photos/seed/camera/600/400" class="card-img-top" alt="Digital camera">
          <div class="card-body d-flex flex-column">
            <h2 class="h5 card-title">Digital Camera</h2>
            <p class="fw-bold text-primary">₹12,999</p>
            <button class="btn btn-primary mt-auto">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
