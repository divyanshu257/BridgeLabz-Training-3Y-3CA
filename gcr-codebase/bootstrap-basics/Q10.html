<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ExploreWorld Travel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .carousel-item img {
      height: 500px;
      object-fit: cover;
      filter: brightness(55%);
    }

    @media (max-width: 600px) {
      .carousel-item img {
        height: 350px;
      }
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white text-center py-4">
    <h1 class="mb-0">ExploreWorld Travel</h1>
  </header>

  <main>
    <div id="destinationCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#destinationCarousel"
          data-bs-slide-to="0"
          class="active"
          aria-current="true"
          aria-label="Slide 1"
        ></button>
        <button
          type="button"
          data-bs-target="#destinationCarousel"
          data-bs-slide-to="1"
          aria-label="Slide 2"
        ></button>
        <button
          type="button"
          data-bs-target="#destinationCarousel"
          data-bs-slide-to="2"
          aria-label="Slide 3"
        ></button>
      </div>

      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="3000">
          <img src="https://picsum.photos/seed/mountains-trip/1400/700" class="d-block w-100" alt="Mountain destination">
          <div class="carousel-caption">
            <h2>Mountain Adventures</h2>
            <p>Discover beautiful mountain views.</p>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="4000">
          <img src="https://picsum.photos/seed/beach-trip/1400/700" class="d-block w-100" alt="Beach destination">
          <div class="carousel-caption">
            <h2>Beach Holidays</h2>
            <p>Relax beside the sea.</p>
          </div>
        </div>

        <div class="carousel-item" data-bs-interval="5000">
          <img src="https://picsum.photos/seed/city-trip/1400/700" class="d-block w-100" alt="City destination">
          <div class="carousel-caption">
            <h2>City Escapes</h2>
            <p>Explore exciting places and cultures.</p>
          </div>
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#destinationCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#destinationCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <section class="container py-5">
      <h2 class="text-center mb-3">Your Booking Progress</h2>
      <p class="text-center">You're 70% done with your travel booking.</p>

      <div
        class="progress"
        role="progressbar"
        aria-label="Booking completion"
        aria-valuenow="70"
        aria-valuemin="0"
        aria-valuemax="100"
        style="height: 25px;"
      >
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          style="width: 70%;"
        >
          70%
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">Contact: travel@exploreworld.example | +91 98765 43210</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
