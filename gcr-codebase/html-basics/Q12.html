<!DOCTYPE html>
<html>
<head>
    <title>Creative Inline Formatting</title>
</head>
<body>

    <p>
        I am a <strong>computer science student</strong> who loves
        <em>coding</em> and <mark>web development</mark>.
        I use <small>HTML</small> to build webpages and
        <code>JavaScript</code> to make them interactive.
    </p>

</body>
</html>
