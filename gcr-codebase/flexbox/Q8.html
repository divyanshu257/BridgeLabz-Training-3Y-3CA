<!DOCTYPE html>
<html>
<head>
  <title>Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background-color: #f2f2f2;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 20px;
    }

    figure {
      background-color: white;
      overflow: hidden;
      border-radius: 10px;
    }

    figure img {
      width: 100%;
      height: 200px;

      object-fit: cover;

      display: block;

      transition: transform 0.5s ease;
    }

    figure img:hover {
      transform: scale(1.08);
    }

    figcaption {
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>My Photo Gallery</h1>

  <div class="gallery">

    <figure>
      <img src="https://picsum.photos/400/300?1" alt="Nature">
      <figcaption>Nature</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?2" alt="Mountain">
      <figcaption>Mountain</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?3" alt="City">
      <figcaption>City</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?4" alt="Beach">
      <figcaption>Beach</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?5" alt="Forest">
      <figcaption>Forest</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/400/300?6" alt="Road">
      <figcaption>Road</figcaption>
    </figure>

  </div>

</body>
</html>
