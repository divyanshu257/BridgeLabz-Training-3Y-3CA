<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    /* Header */
    header {
      background-color: #222;
      padding: 20px;
    }

    nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .box {
      flex: 1;
      max-width: 300px;
      min-height: 200px;
      padding: 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #eee;
      border: 2px solid #333;
      border-radius: 10px;

      transition: 0.3s;
    }

    .box:hover {
      transform: rotate(2deg);
    }

    .box h2 {
      text-align: center;
    }

    /* Footer */
    footer {
      width: 100%;
      padding: 20px;
      background-color: #222;
      color: white;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 700px) {
      main {
        flex-direction: column;
      }

      .box {
        width: 100%;
        max-width: 500px;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>

    <div class="box">
      <h2>Services</h2>
    </div>

    <div class="box">
      <h2>Projects</h2>
    </div>

    <div class="box">
      <h2>Contact</h2>
    </div>

  </main>

  <footer>
    <p>© 2026 My Homepage. All Rights Reserved.</p>
  </footer>

</body>
</html>
