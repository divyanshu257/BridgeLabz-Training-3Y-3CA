<!DOCTYPE html>
<html>
<head>
  <title>Card Flip</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #f2f2f2;
    }

    .card-container {
      width: 300px;
      height: 400px;

      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 100%;

      position: relative;

      transition: transform 0.8s;

      transform-style: preserve-3d;
    }

    .card-container:hover .card {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      width: 100%;
      height: 100%;

      position: absolute;

      backface-visibility: hidden;

      border-radius: 10px;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      padding: 20px;
    }

    .front {
      background-color: white;
    }

    .front img {
      width: 200px;
      height: 200px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    .back {
      background-color: #222;
      color: white;

      transform: rotateY(180deg);
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card-container">

    <div class="card">

      <div class="front">
        <img src="https://picsum.photos/200" alt="Product">
        <h2>My Product</h2>
      </div>

      <div class="back">
        <h2>About Product</h2>
        <p>
          This is a simple product card with a
          3D flip animation.
        </p>
      </div>

    </div>

  </div>

</body>
</html>
