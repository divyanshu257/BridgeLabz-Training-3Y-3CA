<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Grid</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      padding: 40px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .product-card {
      background-color: white;
      padding: 30px 20px;
      border: 1px solid #ddd;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      height: 180px;

      transition: 0.3s;
    }

    .product-card:hover {
      transform: scale(1.05);
    }

    .product-card h2 {
      margin-bottom: 15px;
      text-align: center;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
    }

    /* Tablet */
    @media (max-width: 900px) {
      .product-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .product-container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Our Products</h1>

  <div class="product-container">

    <div class="product-card">
      <h2>Laptop</h2>
      <p class="price">₹55,000</p>
    </div>

    <div class="product-card">
      <h2>Smartphone</h2>
      <p class="price">₹25,000</p>
    </div>

    <div class="product-card">
      <h2>Headphones</h2>
      <p class="price">₹2,500</p>
    </div>

    <div class="product-card">
      <h2>Smart Watch</h2>
      <p class="price">₹4,000</p>
    </div>

    <div class="product-card">
      <h2>Keyboard</h2>
      <p class="price">₹1,500</p>
    </div>

    <div class="product-card">
      <h2>Mouse</h2>
      <p class="price">₹800</p>
    </div>

    <div class="product-card">
      <h2>Monitor</h2>
      <p class="price">₹15,000</p>
    </div>

    <div class="product-card">
      <h2>Bluetooth Speaker</h2>
      <p class="price">₹3,000</p>
    </div>

  </div>

</body>
</html>
