<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Filter Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    h1 {
      text-align: center;
      margin: 30px 0;
    }

    .gallery {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    figure {
      margin: 0;
      padding: 10px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0002;
    }

    img {
      display: block;
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      transition: filter 0.4s ease;
    }

    figure:nth-child(1) img { filter: blur(3px); }
    figure:nth-child(2) img { filter: grayscale(100%); }
    figure:nth-child(3) img { filter: sepia(100%); }
    figure:nth-child(4) img { filter: brightness(50%); }
    figure:nth-child(5) img { filter: contrast(180%); }
    figure:nth-child(6) img { filter: hue-rotate(120deg); }

    figure:hover img {
      filter: none;
    }

    figcaption {
      padding: 12px 0 4px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 599px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>Image Filter Gallery</h1>

  <div class="gallery">
    <figure>
      <img src="https://picsum.photos/seed/filters1/600/400" alt="Blur example">
      <figcaption>Blur</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/filters2/600/400" alt="Grayscale example">
      <figcaption>Grayscale</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/filters3/600/400" alt="Sepia example">
      <figcaption>Sepia</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/filters4/600/400" alt="Brightness example">
      <figcaption>Brightness</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/filters5/600/400" alt="Contrast example">
      <figcaption>Contrast</figcaption>
    </figure>

    <figure>
      <img src="https://picsum.photos/seed/filters6/600/400" alt="Hue rotate example">
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </div>
</body>
</html>
