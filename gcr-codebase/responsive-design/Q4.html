<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Typography</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #eff6ff;
      color: #172554;
    }

    section {
      max-width: 900px;
      margin: 30px;
      padding: 60px 40px;
      text-align: center;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px #0001;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 3rem);
      margin: 0 0 25px;
    }

    p {
      font-size: clamp(1rem, 2vw, 1.5rem);
      line-height: 1.65;
      margin: 0;
    }

    @media (max-width: 700px) {
      section {
        margin: 16px;
        padding: 32px 20px;
      }

      h1 {
        line-height: 1.25;
        margin-bottom: 18px;
      }

      p {
        line-height: 1.8;
      }
    }
  </style>
</head>
<body>
  <section>
    <h1>Typography That Fits Every Screen</h1>
    <p>
      The clamp() function makes text scale automatically on mobile,
      tablet, and desktop screens. Resize the browser to see the change.
    </p>
  </section>
</body>
</html>
