<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Homepage</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 20px 6%;
      background: #1e293b;
      color: white;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1150px;
      margin: auto;
      padding: 50px 20px;
    }

    h1 {
      text-align: center;
    }

    .features {
      display: flex;
      gap: 20px;
      margin-top: 35px;
    }

    .feature {
      flex: 1;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 20px #0001;
      transition: transform 0.3s ease;
    }

    .feature:hover {
      transform: scale(1.04);
    }

    .feature h2 {
      color: #2563eb;
    }

    footer {
      padding: 20px;
      background: #1e293b;
      color: white;
      text-align: center;
    }

    @media (max-width: 749px) {
      header {
        flex-direction: column;
      }

      .features {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BrightSpace</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#features">Features</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="home">
    <h1>Welcome to BrightSpace</h1>

    <div class="features" id="features">
      <div class="feature">
        <h2>Fast</h2>
        <p>Our website works smoothly on different devices.</p>
      </div>

      <div class="feature">
        <h2>Simple</h2>
        <p>Content is clear and easy to understand.</p>
      </div>

      <div class="feature">
        <h2>Flexible</h2>
        <p>The layout adjusts according to screen size.</p>
      </div>
    </div>
  </main>

  <footer id="contact">Contact: hello@brightspace.example</footer>
</body>
</html>
