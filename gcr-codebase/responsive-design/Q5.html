<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter Profile Cards</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
    }

    .profiles {
      display: flex;
      gap: 24px;
      margin-top: 30px;
    }

    .profile {
      flex: 1;
      padding: 22px;
      text-align: center;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 24px #0001;
      animation: fadeIn 0.8s ease both;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .profile:nth-child(2) {
      animation-delay: 0.15s;
    }

    .profile:nth-child(3) {
      animation-delay: 0.3s;
    }

    .profile:hover {
      transform: translateY(-10px);
      box-shadow: 0 14px 30px #0002;
    }

    .profile img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      filter: grayscale(100%);
      transition: filter 0.4s ease;
    }

    .profile:nth-child(2) img {
      filter: sepia(100%);
    }

    .profile:nth-child(3) img {
      filter: contrast(170%);
    }

    .profile:hover img {
      filter: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 799px) {
      .profiles {
        flex-direction: column;
      }

      .profile img {
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Meet the Team</h1>

    <div class="profiles">
      <div class="profile">
        <img src="https://picsum.photos/seed/profile1/600/400" alt="Alex">
        <h2>Alex</h2>
        <p>Frontend Developer</p>
      </div>

      <div class="profile">
        <img src="https://picsum.photos/seed/profile2/600/400" alt="Sam">
        <h2>Sam</h2>
        <p>UI Designer</p>
      </div>

      <div class="profile">
        <img src="https://picsum.photos/seed/profile3/600/400" alt="Taylor">
        <h2>Taylor</h2>
        <p>Content Strategist</p>
      </div>
    </div>
  </main>
</body>
</html>
