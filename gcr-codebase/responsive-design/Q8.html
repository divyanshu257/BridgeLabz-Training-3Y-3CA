<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter Comparison</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    h1 {
      text-align: center;
    }

    .comparison {
      display: flex;
      gap: 20px;
    }

    figure {
      flex: 1;
      margin: 0;
      padding: 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 6px 20px #0001;
    }

    img {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 9px;
    }

    .after img {
      filter: brightness(55%) contrast(135%);
      transition: filter 0.5s ease;
    }

    .after:hover img {
      filter: none;
    }

    figcaption {
      padding: 14px;
      text-align: center;
      font-weight: bold;
    }

    @media (max-width: 699px) {
      .comparison {
        flex-direction: column;
      }

      img {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Before and After Image Comparison</h1>

    <div class="comparison">
      <figure>
        <img src="https://picsum.photos/seed/same-comparison/850/600" alt="Original landscape">
        <figcaption>Before: Original Image</figcaption>
      </figure>

      <figure class="after">
        <img src="https://picsum.photos/seed/same-comparison/850/600" alt="Filtered landscape">
        <figcaption>After: Brightness and Contrast Filter</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
