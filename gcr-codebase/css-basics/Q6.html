<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="Q6.css">
</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
            <div class="caption">Beautiful Mountain</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1016/500/350" alt="Nature">
            <div class="caption">Peaceful Nature</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1018/500/350" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1019/500/350" alt="Beach">
            <div class="caption">Beautiful Landscape</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1020/500/350" alt="River">
            <div class="caption">River View</div>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/id/1024/500/350" alt="Animal">

    </div>

</html>
