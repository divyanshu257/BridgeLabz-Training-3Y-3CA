<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Q8.css">
</head>
<body>

    <!-- Fixed Header -->
    <header>
        <h1>My Dashboard</h1>
    </header>

    <!-- Dashboard Layout -->
    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="#">Messages</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="content">

            <h2>Dashboard Overview</h2>

            <div class="boxes">

                <div class="box">
                    <h3>Total Users</h3>
                    <p>1,250</p>
                    <span>Users registered on the platform.</span>
                </div>

                <div class="box">
                    <h3>Total Sales</h3>
                    <p>₹75,000</p>
                    <span>Total sales generated this month.</span>
                </div>

                <div class="box">
                    <h3>New Messages</h3>
                    <p>45</p>
                    <span>You have new messages to read.</span>
                </div>

                <div class="box">
                    <h3>Pending Tasks</h3>
                    <p>12</p>
                    <span>Tasks are waiting for completion.</span>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
