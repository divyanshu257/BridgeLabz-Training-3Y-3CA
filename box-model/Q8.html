<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model</title>

  <style>
    body{
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #eee;
    }

    .container{
      display: flex;
      gap: 80px;
      text-align: center;
    }

    .example{
      background-color: lightyellow;
      outline: 20px solid lightgray;
      border: 10px solid lightblue;
      padding: 30px;
      margin: 30px;
      width: 200px;
    }

    .default{
      box-sizing: content-box;
    }

    .borderbox{
      box-sizing: border-box;
    }

    .content{
      background-color: lightgreen;
      padding: 20px;
    }

    h2{
      margin-bottom: 50px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div>
      <h2>Default Box Model</h2>

      <div class="example default">
        <div class="content">
          Content
        </div>
      </div>

      <p>box-sizing: content-box</p>
      <p>Width applies only to content.</p>
    </div>

    <div>
      <h2>Border Box</h2>

      <div class="example borderbox">
        <div class="content">
          Content
        </div>
      </div>

      <p>box-sizing: border-box</p>
      <p>Padding and border are included in width.</p>
    </div>

  </div>

</body>
</html>
