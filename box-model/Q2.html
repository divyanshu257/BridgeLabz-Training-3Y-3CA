<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Height and Width Practice</title>

  <style>
    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
    }

    .container{
      width: 90%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .box{
      padding: 20px;
      text-align: center;
      border-radius: 10px;
    }

    .box1{
      width: 250px;
      height: 180px;
      background-color: lightblue;
    }

    .box2{
      width: 30%;
      min-height: 200px;
      background-color: lightgreen;
    }

    .box3{
      width: 20em;
      height: 30vh;
      max-width: 300px;
      overflow: auto;
      background-color: lightcoral;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box box1">
      <h2>Box 1</h2>
      <p>Width: 250px</p>
      <p>Height: 180px</p>
    </div>

    <div class="box box2">
      <h2>Box 2</h2>
      <p>Width: 30%</p>
      <p>Min Height: 200px</p>
    </div>

    <div class="box box3">
      <h2>Box 3</h2>
      <p>Width: 20em</p>
      <p>Height: 30vh</p>
      <p>
        This box demonstrates overflow. If the content becomes larger
        than the available height, a scrollbar will appear automatically.
      </p>
    </div>

  </div>

</body>
</html>
