<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container{
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 100px;
    }

    .item{
      text-align: center;
    }

    .box{
      width: 120px;
      height: 120px;
      background-color: lightblue;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.4s ease;
    }

    .rotate:hover{
      transform: rotate(45deg);
    }

    .scale:hover{
      transform: scale(1.3);
    }

    .translate:hover{
      transform: translate(20px, -20px);
    }

    .skew:hover{
      transform: skew(20deg);
    }
  </style>
</head>

<body>

  <h1>CSS Transformations</h1>

  <div class="container">

    <div class="item">
      <div class="box rotate">Rotate</div>
      <p>rotate(45deg)</p>
    </div>

    <div class="item">
      <div class="box scale">Scale</div>
      <p>scale(1.3)</p>
    </div>

    <div class="item">
      <div class="box translate">Translate</div>
      <p>translate()</p>
    </div>

    <div class="item">
      <div class="box skew">Skew</div>
      <p>skew(20deg)</p>
    </div>

  </div>

</body>
</html>
